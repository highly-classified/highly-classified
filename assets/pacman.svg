<svg width="900" height="120" viewBox="0 0 900 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .dot { fill: #30363d; }
    .pacman { fill: #f7d046; }
    .eye { fill: #0d1117; }

    @keyframes move {
      0% { transform: translateX(0); }
      100% { transform: translateX(820px); }
    }

    @keyframes chomp {
      0%, 100% { d: path("M20,60 A40,40 0 1,1 20,59 Z"); }
      50% { d: path("M20,60 L60,40 A40,40 0 1,1 60,80 Z"); }
    }

    .pacman-group {
      animation: move 8s linear infinite;
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="900" height="120" rx="12"/>

  <!-- Dots -->
  <g>
    <!-- Repeat dots -->
    <circle class="dot" cx="80" cy="60" r="5"/>
    <circle class="dot" cx="120" cy="60" r="5"/>
    <circle class="dot" cx="160" cy="60" r="5"/>
    <circle class="dot" cx="200" cy="60" r="5"/>
    <circle class="dot" cx="240" cy="60" r="5"/>
    <circle class="dot" cx="280" cy="60" r="5"/>
    <circle class="dot" cx="320" cy="60" r="5"/>
    <circle class="dot" cx="360" cy="60" r="5"/>
    <circle class="dot" cx="400" cy="60" r="5"/>
    <circle class="dot" cx="440" cy="60" r="5"/>
    <circle class="dot" cx="480" cy="60" r="5"/>
    <circle class="dot" cx="520" cy="60" r="5"/>
    <circle class="dot" cx="560" cy="60" r="5"/>
    <circle class="dot" cx="600" cy="60" r="5"/>
    <circle class="dot" cx="640" cy="60" r="5"/>
    <circle class="dot" cx="680" cy="60" r="5"/>
    <circle class="dot" cx="720" cy="60" r="5"/>
    <circle class="dot" cx="760" cy="60" r="5"/>
    <circle class="dot" cx="800" cy="60" r="5"/>
  </g>

  <!-- Pac-Man -->
  <g class="pacman-group">
    <path class="pacman" d="M20,60 A40,40 0 1,1 20,59 Z">
      <animate
        attributeName="d"
        dur="0.4s"
        repeatCount="indefinite"
        values="
        M20,60 A40,40 0 1,1 20,59 Z;
        M20,60 L60,40 A40,40 0 1,1 60,80 Z;
        M20,60 A40,40 0 1,1 20,59 Z
        "
      />
    </path>
    <circle class="eye" cx="35" cy="45" r="4"/>
  </g>
</svg>
